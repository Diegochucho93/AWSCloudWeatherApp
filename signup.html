<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="weatherVideo" class="weather-bg-video" autoplay loop muted playsinline>
        <!-- Video source will be set dynamically -->
    </video>
    
    <div class="auth-container">
        <div class="auth-box">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join to save your favorite cities and get personalized weather updates</p>
            
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupName">Name</label>
                    <input type="text" id="signupName" name="name" required placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" name="password" required 
                           placeholder="Enter your password" minlength="6">
                    <small>Minimum 6 characters</small>
                </div>
                
                <div class="form-group">
                    <label for="signupPasswordConfirm">Confirm Password</label>
                    <input type="password" id="signupPasswordConfirm" name="passwordConfirm" required 
                           placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="auth-btn">Create Account</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
                <p><a href="index.html">Continue as guest</a></p>
            </div>
            
            <div id="authError" class="error hidden"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
