<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="weatherVideo" class="weather-bg-video" autoplay loop muted playsinline>
        <!-- Video source will be set dynamically -->
    </video>
    
    <div class="auth-container">
        <div class="auth-box">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your personalized weather dashboard</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                <p><a href="index.html">Continue as guest</a></p>
            </div>
            
            <div id="authError" class="error hidden"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
